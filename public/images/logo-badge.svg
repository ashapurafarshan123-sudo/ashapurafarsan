<svg width="62" height="62" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="badgeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#E8891A" />
    </radialGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3A1B10" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Outer circle with gradient -->
  <circle cx="31" cy="31" r="30" fill="url(#badgeGrad)" stroke="#E07C0A" stroke-width="1" filter="url(#badgeShadow)" />
  <!-- Delicate dashed / beaded inner ring -->
  <circle cx="31" cy="31" r="26.5" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.8" stroke-dasharray="2 1.5" fill="none" />
  <!-- Thin solid inner ring -->
  <circle cx="31" cy="31" r="24.5" stroke="#3A1B10" stroke-opacity="0.3" stroke-width="0.75" fill="none" />
  <!-- Central traditional text -->
  <text x="31" y="35" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="700" font-size="11.5" fill="#3A1B10" letter-spacing="0.04em">Ashapura</text>
</svg>
